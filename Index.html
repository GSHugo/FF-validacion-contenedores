<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validación de Contenedores</title>
<style>:root{--navy:#16324f;--blue:#1976d2;--bg:#f4f7fb;--red:#c62828;--green:#16835b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:#17212b}header{background:var(--navy);color:#fff;padding:16px;position:sticky;top:0;z-index:2}main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #16324f18}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:13px;font-weight:650;display:block;margin-bottom:5px}input,select,textarea,button{width:100%;min-height:44px;border-radius:9px;border:1px solid #c9d4df;padding:10px;font:inherit}button{background:var(--blue);color:#fff;border:0;font-weight:700;cursor:pointer}.secondary{background:#e7eef6;color:#16324f}.danger{background:var(--red)}.success{background:var(--green)}.hidden{display:none!important}.stats{display:flex;gap:12px}.stat{flex:1;background:#edf4fb;padding:10px;border-radius:10px;text-align:center}.item{display:grid;grid-template-columns:56px 1fr 44px;gap:10px;align-items:center;border-top:1px solid #e4eaf0;padding:10px 0}.item img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#eee}.edit{font-size:20px;padding:0;background:#e7eef6;color:#16324f}.muted{color:#66788a;font-size:13px}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#e7eef6;font-size:12px}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#17212b;color:#fff;padding:12px 18px;border-radius:10px;z-index:9;max-width:90%}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><header><strong>Validación de Contenedores</strong><div id="context" class="muted" style="color:#d7e5f4"></div></header><main>
<section id="start" class="card"><h2>Comenzar validación</h2><div class="grid"><div><label>Tu nombre</label><input id="person"></div><div><label>Nombre del equipo</label><input id="teamName" placeholder="Ej. Equipo Azul"></div><div class="full"><label>Contenedor activo</label><select id="container"></select></div><button onclick="joinTeam()">Entrar al contenedor</button><button class="secondary" onclick="toggleNewContainer()">Crear contenedor</button></div><div id="newContainer" class="grid hidden" style="margin-top:12px"><input id="containerRef" placeholder="Referencia del contenedor"><input id="purchaseOrder" placeholder="Orden de compra"><button onclick="createContainer()">Guardar contenedor</button></div></section>
<section id="pallets" class="card hidden"><h2>Tarimas del equipo</h2><div id="palletList"></div><button onclick="createPallet()">＋ Generar nueva tarima</button></section>
<section id="workspace" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><h2 id="palletCode" style="margin:0"></h2><span id="palletStatus" class="pill"></span></div><button class="secondary" style="width:auto" onclick="backToPallets()">Cambiar</button></div><div class="stats" style="margin-top:12px"><div class="stat"><b id="boxCount">0</b><br><span class="muted">Cajas</span></div><div class="stat"><b id="pieceCount">0</b><br><span class="muted">Piezas</span></div></div></div>
<div id="formCard" class="card"><h3 id="formTitle">Capturar caja</h3><input type="hidden" id="captureId"><div class="grid"><div><label>Referencia interna</label><input id="internalRef"></div><div><label>EAN</label><input id="ean" inputmode="numeric"></div><div class="full"><label>Descripción *</label><input id="description"></div><div><label>Piezas en esta caja *</label><input id="pieces" type="number" min="1"></div><div><label>Color</label><input id="color"></div><div><label>Talla</label><input id="size"></div><div><label>Alto (cm)</label><input id="height" type="number" step="0.1"></div><div><label>Largo (cm)</label><input id="length" type="number" step="0.1"></div><div><label>Ancho (cm)</label><input id="width" type="number" step="0.1"></div><div><label>Foto del artículo *</label><input id="itemPhoto" type="file" accept="image/*" capture="environment"></div><div><label>Foto de caja máster *</label><input id="masterPhoto" type="file" accept="image/*" capture="environment"></div><div class="full"><label>Observaciones</label><textarea id="notes"></textarea></div><button onclick="saveCapture()">Guardar caja</button><button class="secondary" onclick="clearForm()">Limpiar</button></div></div>
<div class="card"><h3>Capturado en esta tarima</h3><p class="muted">Se actualiza automáticamente con lo registrado por todo el equipo.</p><div id="captureList"></div><button id="finishBtn" class="success" onclick="finalizePallet()">Finalizar y bloquear tarima</button></div></section></main><div id="toast" class="toast hidden"></div>
<script>
const S={containers:[],container:null,team:null,pallet:null,captures:[],timer:null};
function api(name,data){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)))[name](data));}
async function boot(){try{const r=await api('getBootstrap');S.containers=r.containers;renderContainers();}catch(e){toast(e.message);}}
function renderContainers(){container.innerHTML='<option value="">Selecciona…</option>'+S.containers.map(c=>`<option value="${c.ID_CONTENEDOR}">${esc(c.REFERENCIA_CONTENEDOR)}</option>`).join('');}
function toggleNewContainer(){newContainer.classList.toggle('hidden')}
async function createContainer(){try{busy(true);const c=await api('createContainer',{reference:containerRef.value,purchaseOrder:purchaseOrder.value});S.containers.push(c);renderContainers();container.value=c.ID_CONTENEDOR;newContainer.classList.add('hidden');toast('Contenedor creado');}catch(e){toast(e.message)}finally{busy(false)}}
async function joinTeam(){try{if(!person.value.trim()||!teamName.value.trim()||!container.value)throw Error('Completa nombre, equipo y contenedor.');busy(true);S.container=S.containers.find(c=>c.ID_CONTENEDOR===container.value);const r=await api('openTeam',{containerId:container.value,teamName:teamName.value,person:person.value});S.team=r.team;localStorage.setItem('validatorName',person.value);start.classList.add('hidden');pallets.classList.remove('hidden');context.textContent=`${S.container.REFERENCIA_CONTENEDOR} · ${S.team.NOMBRE_EQUIPO} · ${person.value}`;renderPallets(r.pallets);}catch(e){toast(e.message)}finally{busy(false)}}
function renderPallets(list){palletList.innerHTML=list.length?list.map(p=>`<div class="item"><div>📦</div><div><b>${esc(p.CODIGO_TARIMA)}</b><br><span class="muted">${p.ESTADO}</span></div><button class="edit" onclick="openPallet('${p.ID_TARIMA}')">›</button></div>`).join(''):'<p class="muted">Todavía no hay tarimas para este equipo.</p>'}
async function createPallet(){try{busy(true);const p=await api('createPallet',{containerId:S.container.ID_CONTENEDOR,teamId:S.team.ID_EQUIPO,person:person.value});await openPallet(p.ID_TARIMA);}catch(e){toast(e.message)}finally{busy(false)}}
async function openPallet(id){try{busy(true);S.pallet={ID_TARIMA:id};const r=await api('getPallet',{palletId:id,teamId:S.team.ID_EQUIPO});applyPallet(r);pallets.classList.add('hidden');workspace.classList.remove('hidden');clearInterval(S.timer);S.timer=setInterval(refresh,4000);}catch(e){toast(e.message)}finally{busy(false)}}
async function refresh(){if(!S.pallet)return;try{applyPallet(await api('getPallet',{palletId:S.pallet.ID_TARIMA,teamId:S.team.ID_EQUIPO}));}catch(e){}}
function applyPallet(r){S.pallet=r.pallet;S.captures=r.captures;palletCode.textContent=r.pallet.CODIGO_TARIMA;palletStatus.textContent=r.pallet.ESTADO;boxCount.textContent=r.totals.boxes;pieceCount.textContent=r.totals.pieces;const open=r.pallet.ESTADO==='EN PROCESO';formCard.classList.toggle('hidden',!open);finishBtn.classList.toggle('hidden',!open);captureList.innerHTML=r.captures.length?r.captures.map(x=>`<div class="item"><img src="${x.FOTO_ITEM_URL}" alt=""><div><b>${esc(x.DESCRIPCION)}</b><br><span class="muted">Caja ${x.NUMERO_CAJA} · ${x.PIEZAS_CAJA} pzas · ${esc(x.REFERENCIA_INTERNA||x.EAN)}</span><br><span class="muted">${esc(x.VALIDADOR)}</span></div>${open?`<button class="edit" onclick="editCapture('${x.ID_CAPTURA}')">✎</button>`:''}</div>`).join(''):'<p class="muted">Sin cajas capturadas.</p>'}
function editCapture(id){const x=S.captures.find(v=>v.ID_CAPTURA===id);['captureId','internalRef','ean','description','pieces','color','size','height','length','width','notes'].forEach(k=>document.getElementById(k).value=x[({captureId:'ID_CAPTURA',internalRef:'REFERENCIA_INTERNA',ean:'EAN',description:'DESCRIPCION',pieces:'PIEZAS_CAJA',color:'COLOR',size:'TALLA',height:'ALTO_CM',length:'LARGO_CM',width:'ANCHO_CM',notes:'OBSERVACIONES'})[k]]||'');formTitle.textContent='Editar caja '+x.NUMERO_CAJA;formCard.scrollIntoView({behavior:'smooth'});}
async function saveCapture(){try{busy(true);const payload={captureId:captureId.value,palletId:S.pallet.ID_TARIMA,teamId:S.team.ID_EQUIPO,person:person.value,internalRef:internalRef.value,ean:ean.value,description:description.value,pieces:pieces.value,color:color.value,size:size.value,height:height.value,length:length.value,width:width.value,notes:notes.value,itemPhoto:await imageData(itemPhoto.files[0]),masterPhoto:await imageData(masterPhoto.files[0])};applyPallet(await api('saveCapture',payload));clearForm();toast('Caja guardada');}catch(e){toast(e.message)}finally{busy(false)}}
function imageData(file){if(!file)return Promise.resolve('');return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.78))};img.onerror=rej;img.src=url})}
function clearForm(){document.querySelectorAll('#formCard input,#formCard textarea').forEach(e=>e.value='');formTitle.textContent='Capturar caja'}
async function finalizePallet(){if(!confirm('¿Finalizar esta tarima? Después ya no podrá editarse desde los teléfonos.'))return;try{busy(true);applyPallet(await api('finalizePallet',{palletId:S.pallet.ID_TARIMA,teamId:S.team.ID_EQUIPO,person:person.value}));toast('Tarima finalizada y bloqueada');}catch(e){toast(e.message)}finally{busy(false)}}
async function backToPallets(){clearInterval(S.timer);S.pallet=null;workspace.classList.add('hidden');pallets.classList.remove('hidden');renderPallets(await api('listPallets',{containerId:S.container.ID_CONTENEDOR,teamId:S.team.ID_EQUIPO}))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(m){toastEl=document.getElementById('toast');toastEl.textContent=m;toastEl.classList.remove('hidden');setTimeout(()=>toastEl.classList.add('hidden'),3500)}function busy(v){document.querySelectorAll('button').forEach(b=>b.disabled=v)}
person.value=localStorage.getItem('validatorName')||'';boot();
</script></body></html>
